name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Run Android checks
        env:
          DEVICE_GUARD_UPDATE_MANIFEST_URL: https://attacker.invalid/latest.json
          DEVICE_GUARD_UPDATE_PUBLIC_KEY: attacker-controlled
        run: |
          ./gradlew --no-daemon --max-workers=2 test lintRelease verifyChannelDisabledRelease

      - name: Verify explicit pilot update-channel build
        env:
          # Hostile ambient values must not affect ordinary builds or the
          # repository-pinned pilot channel.
          DEVICE_GUARD_UPDATE_MANIFEST_URL: http://attacker.invalid/latest.json
          DEVICE_GUARD_UPDATE_PUBLIC_KEY: attacker-controlled
        run: ./gradlew -I gradle/pilot-update.init.gradle.kts --no-daemon --max-workers=2 clean ciPilotChannelRelease

      - name: Test release publisher
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14
