name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Run Android checks
        env:
          DEVICE_GUARD_UPDATE_MANIFEST_URL: https://attacker.invalid/latest.json
          DEVICE_GUARD_UPDATE_PUBLIC_KEY: attacker-controlled
        run: |
          ./gradlew --no-daemon --max-workers=2 test lintRelease assembleRelease
          python3 tools/verify_pilot_apk.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --expected-package com.example.lockdowndpc \
            --expected-version-code 11 --expected-version-name 0.5.2 \
            --require-single-signer \
            --expect-channel-disabled

      - name: Verify explicit pilot update-channel build
        env:
          # Hostile ambient values must not affect ordinary builds or the
          # repository-pinned pilot channel.
          DEVICE_GUARD_UPDATE_MANIFEST_URL: http://attacker.invalid/latest.json
          DEVICE_GUARD_UPDATE_PUBLIC_KEY: attacker-controlled
        run: ./gradlew -I gradle/pilot-update.init.gradle.kts --no-daemon --max-workers=2 clean ciPilotChannelRelease

      - name: Test release publisher
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14
